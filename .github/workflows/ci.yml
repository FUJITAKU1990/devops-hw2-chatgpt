name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build:database
          npm run build:mail

      - name: Type-check services (no build script; ts-node runs raw TS)
        run: |
          npx tsc --noEmit -p services/api-gateway/tsconfig.json
          npx tsc --noEmit -p services/auth-service/tsconfig.json
          npx tsc --noEmit -p services/ticket-service/tsconfig.json

      - name: Build frontend
        run: npm run build -w frontend

      - name: Prepare env
        run: |
          cp -n .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=$|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^PAYMENT_DB_PASSWORD=$|PAYMENT_DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^TARTANPAY_API_KEY=$|TARTANPAY_API_KEY=tp_sk_ci_$(openssl rand -hex 16)|" .env
          sed -i "s|^TARTANPAY_ADMIN_TOKEN=$|TARTANPAY_ADMIN_TOKEN=tp_admin_ci_$(openssl rand -hex 16)|" .env
          sed -i "s|^TARTAN_ADMIN_PASSWORD=$|TARTAN_ADMIN_PASSWORD=$(openssl rand -hex 12)|" .env
          sed -i "s|^MP_UI_AUTH=$|MP_UI_AUTH=admin:$(openssl rand -hex 12)|" .env
          sed -i "s|^STUDENT_FIXTURE_PASSWORD=$|STUDENT_FIXTURE_PASSWORD=$(openssl rand -hex 12)|" .env
          
      - name: Validate Compose config
        run: docker compose config -q

      - name: Start application stack
        run: docker compose up --build -d

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8636/api/events > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run ./scripts/check
        env:
          TARTAN_BASE_URL: http://localhost:8636
        run: |
          set -a
          source .env
          set +a
          ./scripts/check

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=500

      - name: Tear down
        if: always()
        run: docker compose down -v
  
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          cd /tmp
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$ASSET"
          curl -sSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$ASSET" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "range=${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run gitleaks over the commit range
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.range }}" \
            --redact --exit-code 1
  
  guardrails-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Run secret guardrails check
        run: ./scripts/check-secret-guardrails

  ci-integrity-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI integrity check
        run: ./scripts/check-ci-integrity
